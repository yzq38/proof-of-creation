[workspace]
authors = ["czt0221 <2320231515@qq.com>"]
channels = ["conda-forge"]
name = "proof-of-creation"
platforms = ["win-64"]
version = "0.1.0"

[tasks]
server = "python -m server.app"

[dependencies]
python = ">=3.14.5,<3.15"
flask = ">=3.1.3,<4"
python-dotenv = ">=1.2.2,<2"
requests = ">=2.34.2,<3"
web3 = ">=7.16.0,<8"
reportlab = ">=4.5.1,<5"
pyjwt = ">=2.13.0,<3"
py-solc-x = ">=2.0.5,<3"

[feature.poc-crypto.dependencies]
cryptography = ">=48.0.0,<49"

[feature.poc-crypto.pypi-dependencies]
pqcrypto = ">=0.4.0, <0.5"

[feature.poc-crypto.tasks]
crypto = "python poc-crypto/main.py"

[feature.build.dependencies]
pyinstaller = ">=6.20.0, <6.21"

[feature.build.tasks]
build = "pixi run build-crypto"
build-crypto = "pyinstaller poc-crypto.spec"

[environments]
default = { features = ["default"] }
poc-crypto = { features = ["default", "poc-crypto"], solve-group = "default" }
build = { features = ["default", "poc-crypto", "build"], solve-group = "default" }
